<app-header />

<main class="min-h-[75vh]">
  <router-outlet />
</main>

<footer class="mt-10 border-t border-white/8 px-4 py-6">
  <div class="flex flex-col items-center gap-3">
    <a routerLink="/" class="flex items-baseline gap-1" aria-label="Boorushiko">
      <span class="text-sm font-black tracking-tight text-white">booru</span>
      <span class="text-sm font-black tracking-tight text-sakura-400">shiko</span>
    </a>
    <p class="font-mono text-[10px] uppercase tracking-[0.2em] text-ink-500">
      {{ i18n.t().footer }}
    </p>
    <nav
      [attr.aria-label]="i18n.t().footerInfo"
      class="flex flex-wrap justify-center gap-x-4 gap-y-1 font-mono text-[10px] uppercase tracking-[0.14em] text-ink-500"
    >
      <a routerLink="/pools" class="transition hover:text-ink-200">{{ i18n.t().pools }}</a>
      <a routerLink="/favorites" class="transition hover:text-ink-200">{{ i18n.t().favorites }}</a>
      <a routerLink="/random" class="transition hover:text-ink-200">{{ i18n.t().random }}</a>
      <a href="/feed.xml" class="transition hover:text-ink-200">{{ i18n.t().rss }}</a>
      <a routerLink="/about" class="transition hover:text-ink-200">{{ i18n.t().about }}</a>
      <a routerLink="/help" class="transition hover:text-ink-200">{{ i18n.t().help }}</a>
      <a routerLink="/stats" class="transition hover:text-ink-200">{{ i18n.t().stats }}</a>
      <a routerLink="/rules" class="transition hover:text-ink-200">{{ i18n.t().rules }}</a>
      <a routerLink="/dmca" class="transition hover:text-ink-200">{{ i18n.t().dmca }}</a>
      <a routerLink="/tos" class="transition hover:text-ink-200">{{ i18n.t().tos }}</a>
    </nav>
    <div class="flex justify-center xl:hidden">
      <neko-clock [size]="'sm'" />
    </div>
    <p class="font-mono text-[10px] text-ink-600">Boorushiko · {{ year }}</p>
  </div>
</footer>
